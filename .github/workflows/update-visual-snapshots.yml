name: Update Visual Snapshots

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-visual-snapshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup (Install node & pnpm)
        uses: ./.github/actions/setup

      - name: Update Linux visual references
        run: pnpm test:visual:update

      - name: Commit and push reviewed scope
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git add -- ':(glob)packages/core/src/**/__screenshots__/*.visual.browser.test.ts/*-chromium-linux.png'

          if git diff --cached --quiet; then
            echo "Visual references are already up to date."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: update Linux visual snapshots'
          git push origin "HEAD:${BRANCH_NAME}"
