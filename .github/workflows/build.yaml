name: Verify Browser Mode Migration

on:
  push:
    branches:
      - browserMode
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-browser-mode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Check case-study document links
        run: pnpm docs:check-links

      - name: Type-check functional and visual tests
        run: |
          pnpm --filter reka-ui type-check
          pnpm --filter reka-ui type-check:visual

      - name: Verify migration inventory is current
        run: |
          pnpm --filter reka-ui port:inventory
          git diff --exit-code -- PORT-INVENTORY.tsv

      - name: Verify all browser and jsdom pairs retain structural parity
        run: pnpm --filter reka-ui port:parity --complete

      - name: Run Node, retained jsdom, and Chromium projects
        run: pnpm --filter reka-ui exec vitest run
